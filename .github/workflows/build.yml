name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.LCKDN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \357\273\277' | base64 -d > "$RUNNER_TEMP/lckdn.jks"
            echo "LCKDN_KEYSTORE=$RUNNER_TEMP/lckdn.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key configured; using a debug key."
          fi

      - name: Build release APK
        env:
          LCKDN_KEYSTORE_PASSWORD: ${{ secrets.LCKDN_KEYSTORE_PASSWORD }}
          LCKDN_KEY_ALIAS: ${{ secrets.LCKDN_KEY_ALIAS }}
          LCKDN_KEY_PASSWORD: ${{ secrets.LCKDN_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/LCKDN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LCKDN-apk
          path: out/LCKDN.apk

      - name: Read app version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish release for this version (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: out/LCKDN.apk
          name: LCKDN v${{ steps.ver.outputs.name }}
          body: |
            Download **LCKDN.apk** below and open it on your Android phone (Android 8.0+).
            See the README for setup steps.

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/LCKDN.apk
          name: LCKDN ${{ github.ref_name }}
          body: |
            Download **LCKDN.apk** below and open it on your Android phone (Android 8.0+).
            See the README for setup steps.
